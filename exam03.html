<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자모양태그</title>
</head>
<body>
    <a href = "index.html" target = "_blank">index.html</a>
    <h1>글자모양 태그의 사용</h1>
    삼육대학교 <b>인공지능융합학부</b><br>
    삼육대학교 <i>인공지능융합학부</i><br>
    삼육대학교 <small>인공지능융합학부</small>
    삼육대학교 인공지능<sub>융합학부</sub><br>
    삼육대학교 인공지능<sup>융합학부</sup><br>
    삼육대학교<ins>인공지능융합학부</ins><br>
    삼육대학교<del>인공지능융합학부</del><br>
    삼육대학교<strong>인공지능융합학부</strong><br>
    삼육대학교<em>인공지능융합학부</em><br>
    삼육대학교<mark>인공지능융합학부</mark><br>
