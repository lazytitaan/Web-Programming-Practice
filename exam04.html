<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록</title>
</head>
<body>
    <h1>글머리 기호 목록</h1>
    <ul type = "circle">
        <li>HTML</li>
        <li>css</li>
        <li>js</li>
    </ul>
    <h2>순서 번호 목록</h2>
    <ol type="A" start="1">
        <li>HTML</li>
        <li>css</li>
        <li>js</li>
    </ol>
    <h2>정의 목록</h2>
    <dl>
        <dt>프론트앤드</dt>
        <dd>HTML</dd>
        <dd>CSS</dd>
        <dd>JS</dd>

    </dl>
</body>
</html>
