<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 태그</title>
</head>
<body>
    <a href="index2.html">index2.html</a>

    <!-- attribute는 우선순위가 없고 아무 순서로 써도 됨 -->

    <h1>목록 태그</h1>

    <h2>글머리 기호 목록</h2>
    <!--
        ul (unordered list)    글머리 기호 목록 태그
            type : disc(default), circle, square
    -->
    <ul type="disc">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ul type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>

    <h2>순서 번호 목록</h2>
    <!--
        li (list item)    목록 요소
            type : 1, a, A, i, I
            start : 시작 번호, default : 1
    -->
    <ol type="1">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <ol type="a">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <ol type="i">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <ol type="I" start="5">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>

    <h2>정의 목록</h2>
    <!--
        dl    정의 목록 태그
        dt   제목
        dd    설명
    -->
    <dl>
        <dt>프론트엔드</dt>
        <dd>HTML</dd>
        <dd>CSS</dd>
        <dd>JS</dd>
    </dl>
</body>
</html>
