<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 태그</title>
</head>
<body>
    <a href="index2.html">index2.html</a>

    <h1>글자 태그</h1>

    <h2>글자 모양 태그</h2>
    <!--
        b    굵은 글자 태그
        i    기울어진 글자 태그
        small    작은 글자 태그
        sub    아래 첨자 태그
        sup    위 첨자 태그
        ins   밑줄 글자 태그
        del    가운데 줄이 그어진 글자(취소선) 태그
    -->
    b : 삼육대학교 <b>인공지능융합학부</b><br>
    i : 삼육대학교 <i>인공지능융합학부</i><br>
    small : 삼육대학교 <small>인공지능융합학부</small><br>
    sub : 삼육대학교 인공지능<sub>융합학부</sub><br>
    sup : 삼육대학교 인공지능<sup>융합학부</sup><br>
    ins : 삼육대학교 <ins>인공지능융합학부</ins><br>
    del : 삼육대학교 <del>인공지능융합학부</del><br>

    <h2>강조 태그</h2>
    <!--
        strong    강조(굵게),b와 시각적으로 같으나 중요한 태그임을 봇에게 알려줄 수 있음
        em    강조(기울임), i와 시각적으로 같으나 중요한 태그임을 봇에게 알려줄 수 있음
        mark    현광펜
    -->
    strong : 삼육대학교 <strong>인공지능융합학부</strong><br>
    em : 삼육대학교 <em>인공지능융합학부</em><br>
    mark : 삼육대학교 <mark>인공지능융합학부</mark><br>
</body>
</html>
