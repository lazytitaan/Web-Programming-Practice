<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 태그</title>
</head>
<body>
    <a href="index2.html">index2.html</a>

    <h1>테이블 태그</h1>

    <h2>테이블 태그 종류</h2>
    <!--
        table    표, 행과 열로 구성됨
            border="1" 표의 스타일 꾸미기, 지금은 잘 쓰지 않는 기능
        thead    표의 머리
        tbody    표의 본문
        tfoot    표의 꼬리
        tr    표의 행
        th    표의 제목 요소, 열
        td    표의 일반 요소, 열

        표의 default크기는 element의 길이에 따라 자동으로 늘어남
    -->
    <table border="1">
        <thead>
            <tr>
                <th>제목11</th>
                <th>제목12</th>
                <th>제목13</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>내용21</td>
                <td>내용22</td>
                <td>내용23</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>꼬리1</td>
                <td>꼬리2</td>
                <td>꼬리3</td>
            </tr>
        </tfoot>
    </table>

    <h2>셀 합치기</h2>
    <!--
        colspan    열 합치기(합칠 열, 좌우의 개수)
            <td colspan="2">내용11</td>
        rowspan    행 합치기(합칠 행, 위아래의 개수)
            <td rowspan="2">내용11</td>
    -->
    <table border="1">
        <tr>
            <td colspan="2">내용11</td>
            <td>내용13</td>
        </tr>
        <tr>
            <td rowspan="2">내용21</td>
            <td>내용22</td>
            <td>내용23</td>
        </tr>
        <tr>
            <td>내용32</td>
            <td>내용33</td>
        </tr>
    </table>

    <h2>레이아웃</h2>
    <!-- 레이아웃의 형태를 잡아주기 위해 표를 아용하기도 함, 지금은 스타일만 사용하여 이런 방식은 안씀 -->
    <table border="1">
        <tr>
            <td colspan="3">머리말</td>
        </tr>
        <tr>
            <td>메뉴</td>
            <td>본문</td>
            <td>광고</td>
        </tr>
        <tr>
            <td colspan="3">꼬리말</td>
        </tr>
    </table>
</body>
</html>
